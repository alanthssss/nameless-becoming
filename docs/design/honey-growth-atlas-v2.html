 for(let k=0;k<c.ranks.length;k++){const xx=(k-(c.ranks.length-1)/2)*5.8;sh+='<circle cx="'+xx+'" cy="15" r="1.8" fill="'+(k<rank?'#e8f1cb':st==='locked'?'#97a18b':'#826d45')+'"/>'}
 sh+='</g><text class="nodetext" y="38" text-anchor="middle">'+escapeHTML(c.branch==='hub'?(c.id==='feast'?'蜜宴':'蜂巢'):name(c))+'</text></g>'}
 sh+='</g>';map.innerHTML=sh;applyCamera();
}
function mapBounds(){const ps=Object.values(geometry),r=Math.max(...ps.map(p=>Math.hypot(p.x/stretch,p.y)))+64;return {w:r*1.89*stretch,h:r*2.08}}
function size(){const box=map.getBoundingClientRect();W=Math.max(180,box.width);H=Math.max(180,box.height);map.setAttribute('viewBox','0 0 '+W+' '+H);const newStretch=Math.max(1,Math.min(1.84,1.04*W/H));const changed=Math.abs(newStretch-stretch)>.005;if(changed){stretch=newStretch;geo()}const b=mapBounds();fitScale=Math.min(W/b.w,H/b.h);if(changed)drawMap();else applyCamera()}
function applyCamera(){const sc=camera.s*fitScale;map.querySelector('#scene')?.setAttribute('transform','translate('+(W/2-camera.x*sc)+' '+(H/2-camera.y*sc)+') scale('+sc+')');$('zoom').value=Math.round(camera.s*100)+'%';map.querySelectorAll('.nodetext').forEach(t=>{const id=t.parentElement.dataset.cell;t.style.display=sc>.44||id===selected?'':'none';t.style.fontSize=(Math.max(11,Math.min(17,sc*14))/sc)+'px';const c=C[id];if(c.branch==='hub'){t.style.display='';t.setAttribute('y',id==='feast'?-34:40)}});}
function clampPan(){const bounds=mapBounds();const cx=bounds.w*.65,cy=bounds.h*.62;camera.x=Math.max(-cx,Math.min(cx,camera.x));camera.y=Math.max(-cy,Math.min(cy,camera.y))}
function center(id,zoom){const p=geometry[id];camera.x=p.x;camera.y=p.y;if(zoom)camera.s=Math.max(camera.s,Math.min(4,1.06/fitScale));clampPan();applyCamera()}
function nodeInsideView(id){
 const scale=camera.s*fitScale,p=geometry[id];
 const dx=Math.abs(p.x-camera.x)*scale,dy=Math.abs(p.y-camera.y)*scale;
 return dx+32*scale<=W/2 && dy+44*scale<=H/2;
}
function zoomBy(f,x=W/2,y=H/2){const s=camera.s,ns=Math.min(5,Math.max(.85,s*f));camera.x+=(x-W/2)*(1/s-1/ns)/fitScale;camera.y+=(y-H/2)*(1/s-1/ns)/fitScale;camera.s=ns;clampPan();applyCamera()}
function choose(id,focus=false,rank=null){if(!C[id])return;selected=id;inspection=rank&&C[id].ranks.includes(rank)?rank:next(C[id])??C[id].ranks.at(-1);notice='';bought=null;discoveries=[];render();if(focus)center(id,true);persist()}
function chips(ids){return ids.map(id=>'<button type="button" class="'+(S.owned.has(id)?'':'missing')+'" data-rank="'+id+'">'+(S.owned.has(id)?'✓ ':'')+escapeHTML(V[id]?.name??id)+'</button>').join('')}
function requirements(row){let out='';const A=row.requires_all||[],B=row.requires_any||[],q=countReq(row);if(A.length)out+='<div class="req reqline"><small>全部</small>'+chips(A)+'</div>';if(B.length)out+='<div class="req reqline"><small>任选一项</small>'+chips(B)+'</div>';if(q)out+='<details class="reqline"><summary>累计购买 '+q.keys.filter(k=>S.owned.has(k)).length+' / '+q.min+' 档 · 查看范围</summary><div class="req">'+chips(q.keys)+'</div></details>';
 const world=row.requires_world||{},words=[];if(world.visited_meadow)words.push((S.world.visited_meadow?'✓ ':'○ ')+'到访紫花地');if(world.min_lifetime_violet_sold)words.push('紫蜜已售 '+S.world.lifetime_violet_sold+' / '+world.min_lifetime_violet_sold);for(const [key,label] of [['sealed','首次封罐'],['lantern_lit','庭院点灯'],['feast_open','蜂巢开席']])if(world[key])words.push((S.world[key]?'✓ ':'○ ')+label);
 if(words.length)out+='<div class="req"><small>'+words.join(' · ')+'</small></div>';return out||'<div class="req">庭院书台 · 随时可学</div>'}
function render(){
 const bayQuery=new URLSearchParams();for(const [param,skill] of [['trace','petal_trace'],['garland','garland'],['cascade','cascade']])bayQuery.set(param,S.owned.has(skill+'2')?2:S.owned.has(skill+'1')?1:0);$('baylink').href='honey-flower-bay-v2.html?'+bayQuery.toString();
 const cell=C[selected],row=V[inspection],have=cell.ranks.filter(id=>S.owned.has(id)).length,rankidx=cell.ranks.indexOf(inspection)+1;
 $('summary').textContent=D.cells.length+' 个花格 · '+D.ranks.length+' 档成长';
 $('progress').textContent=(S.world.feast_open?'已开席':S.world.lantern_lit?'已点灯':S.world.sealed?'已封罐':'庭院出发')+' · 已购 '+S.owned.size+' / '+D.ranks.length+' 档';
 $('wallet').innerHTML=Object.keys(nouns).map(k=>'<span class="item">'+icon(k)+'<strong>'+S.wallet[k]+'</strong><span class="unit">'+nouns[k]+'</span></span>').join('');
 $('chapter').textContent=dnames[cell.branch]+' / '+(stages[cell.stage]||cell.stage);$('ranknum').textContent='已学 '+have+' / '+cell.ranks.length+' 档';$('sig').innerHTML=icon(glyph(cell));$('title').textContent=cell.name;$('status').textContent=row.name+' · '+rankState(row.id);
 $('ranks').innerHTML=cell.ranks.map((id,i)=>'<button type="button" data-inspect="'+id+'" aria-pressed="'+(id===inspection)+'">'+(S.owned.has(id)?'✓ ':'')+'第 '+(i+1)+' 档</button>').join('');
 $('effect').textContent=row.effect_text||row.description||row.name;$('feedback').textContent=row.feedback||'';$('conditions').innerHTML=requirements(row);$('cost').innerHTML=price(row,'cost');
 $('firstbasket').hidden=!(S.owned.size===0&&S.wallet.coins===0);findcell.value=selected;const s=rankState(row.id);$('buy').disabled=s!=='可购买';$('buy').textContent=s==='可购买'?'学习 · '+row.name:s==='已习得'?'✓ 已习得':s==='资源不足'?'资源不足 · 查看上方差额':s==='待解锁'?'等待解锁条件':'先学习本格前档';
 $('receipt').textContent=notice;$('receipt').style.color=noticeError?'#a4442e':'';$('branches').innerHTML='<span>定位</span>'+dirs.map(d=>'<button data-branch="'+d+'" class="'+(cell.branch===d?'active':'')+'">'+dnames[d]+'</button>').join('');
 drawMap();
}
function purchase(){
 const row=V[inspection],c=C[selected];if(!row||S.owned.has(row.id)||next(c)!==row.id||misses(row)||!enough(row))return;
 const previouslyLocked=D.cells.filter(c=>state(c)==='locked').map(c=>c.id);for(const [k,n] of Object.entries(row.cost))S.wallet[k]-=n;
 S.owned.add(row.id);bought=c.id;noticeError=false;notice='已学 '+row.name+' · 扣除 '+Object.entries(row.cost).filter(([,n])=>n).map(([k,n])=>n+' '+nouns[k]).join('、');
 discoveries=previouslyLocked.filter(k=>state(C[k])!=='locked');if(discoveries.length)notice+='。新解锁：'+discoveries.map(k=>C[k].name).join('、');inspection=next(c)??row.id;persist();render();
}
function getPreset(id,fromStart=false){
 preset=D.presets.find(p=>p.id===id)||D.presets[0];menu.value=preset.id;let saved=null;try{saved=JSON.parse(stored(store+preset.id)||'null')}catch{}
 S=normalize(!fromStart&&saved&&Array.isArray(saved.owned)&&saved.wallet?saved:preset);
 const entry=Object.values(C).find(c=>c.stage===(S.world.lantern_lit?'late':S.world.sealed?'mid':'demo')&&state(c)==='open'&&c.branch==='gather')||Object.values(C).find(c=>c.stage!=='demo'&&state(c)==='open');
 selected=!fromStart&&C[saved?.selected]?saved.selected:(cellOf[preset.selected_rank]||(S.world.sealed&&entry?entry.id:firstCell));
 inspection=next(C[selected])??C[selected].ranks.at(-1);camera={x:0,y:0,s:1};notice='';bought=null;discoveries=[];render();size();persist();
}
function canAction(a){if(!a)return false;const q=countReq(a);return !(a.requires_all||[]).some(k=>!S.owned.has(k))&&(!(a.requires_any||[]).length||a.requires_any.some(k=>S.owned.has(k)))&&(!q||q.keys.filter(k=>S.owned.has(k)).length>=q.min)&&!worldMissing(a.requires_world).length}
function actionsData(){return D.world_actions||[]}
function stageKey(a){return a.sets||a.set_world||a.world_key||a.id}
function settings(){
 const w=preset.wallet;
 $('startwallet').textContent='当前为「'+preset.name+'」独立样例。预置钱包 '+w.coins+' 金币、'+w.fiber+' 纤维、'+w.resin+' 树脂。下列操作只改变本演示档。';
 const ev=[['pond','池岸满篮 · ＋6币1纤',true],['visit','到访紫花地',S.owned.has('meadow')&&!S.world.visited_meadow],['violet','交售6紫蜜 · ＋'+(S.owned.has('market')?22:18)+'币1脂',S.world.visited_meadow]];
 $('supplies').innerHTML=ev.map(([id,label,ok])=>'<button type="button" data-event="'+id+'" '+(!ok?'disabled':'')+'>'+label+'</button>').join('');
 $('actions').innerHTML=actionsData().map(a=>{const key=stageKey(a),done=!!S.world[key],ok=canAction(a),q=countReq(a);
     const req=[...(a.requires_all||[]).map(id=>V[id]?.name??id),...(a.requires_any?.length?[a.requires_any.map(id=>V[id]?.name??id).join('／')+' 任选一项']:[]),...(q?['指定招牌 '+q.keys.filter(k=>S.owned.has(k)).length+'/'+q.min]:[]),...worldMissing(a.requires_world)];
     return '<div class="worldrow"><div><b>'+escapeHTML(a.name||key)+'</b><br><small>'+escapeHTML(done?'已完成':req.join(' · ')||'庭院可交互')+'</small></div><button data-action="'+a.id+'" '+(done||!ok?'disabled':'')+'>'+escapeHTML(done?'已完成':ok?'在庭院执行':'条件未齐')+'</button></div>'}).join('');
}
function simulate(key){if(key==='pond'){S.wallet.coins+=6;S.wallet.fiber+=1;notice='模拟池岸归巢，交售得 6 金币，带回 1 纤维。'}else if(key==='visit'&&S.owned.has('meadow')&&!S.world.visited_meadow){S.world.visited_meadow=true;notice='模拟抵达紫花地。'}else if(key==='violet'&&S.world.visited_meadow){S.world.lifetime_violet_sold+=6;S.wallet.coins+=18+(S.owned.has('market')?4:0);S.wallet.resin+=1;notice='模拟紫花地归巢，已按当前口碑交售 6 份紫蜜，带回 1 树脂。'}else return;persist();render();settings()}
function worldAction(id){const a=actionsData().find(x=>x.id===id);if(!a||!canAction(a)||S.world[stageKey(a)])return;S.world[stageKey(a)]=true;notice='庭院 · '+a.name+'已完成';persist();render();settings()}
$('firstbasket').onclick=()=>{if(!S.owned.size&&!S.wallet.coins)simulate('pond')};$('buy').onclick=purchase;$('ranks').onclick=e=>{const id=e.target.closest('[data-inspect]')?.dataset.inspect;if(id){choose(selected,false,id);$('ranks').querySelector('[aria-pressed="true"]')?.focus({preventScroll:true})}};
$('buy').addEventListener('keydown',event=>{
 if(event.repeat&&(event.key==='Enter'||event.key===' '))event.preventDefault();
});
$('conditions').onclick=e=>{const id=e.target.closest('[data-rank]')?.dataset.rank;if(id){choose(cellOf[id],true,id);$('ranks').querySelector('[aria-pressed="true"]')?.focus({preventScroll:true})}};
$('branches').onclick=e=>{const d=e.target.closest('[data-branch]')?.dataset.branch;if(!d)return;const cs=D.cells.filter(c=>c.branch===d);const target=cs.find(c=>c.stage===(S.world.lantern_lit?'late':S.world.sealed?'mid':'demo')&&state(c)==='open')||cs.find(c=>state(c)==='open')||cs[0];if(target)choose(target.id,true)};
menu.onchange=()=>getPreset(menu.value);$('plus').onclick=()=>zoomBy(1.3);$('minus').onclick=()=>zoomBy(1/1.3);$('overview').onclick=()=>{camera={x:0,y:0,s:1};applyCamera()};$('home').onclick=()=>choose(C.reserve?'reserve':D.cells.find(c=>c.branch==='hub').id,true);
$('world').onclick=()=>{settings();$('settings').showModal()};$('close').onclick=()=>$('settings').close();
let resetArmed=false;$('reset').onclick=()=>{if(!resetArmed){resetArmed=true;$('reset').textContent='确认还原本档';return}resetArmed=false;$('reset').textContent='还原本演示档';getPreset(preset.id,true);settings()};$('settings').addEventListener('close',()=>{resetArmed=false;$('reset').textContent='还原本演示档'});
$('supplies').onclick=e=>{const b=e.target.closest('[data-event]');if(b)simulate(b.dataset.event)};$('actions').onclick=e=>{const b=e.target.closest('[data-action]');if(b)worldAction(b.dataset.action)};
const pointers=new Map();let initial=null,dragged=false;
function loc(e){const r=map.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
map.onpointerdown=e=>{if(e.button!==0)return;const p=loc(e);pointers.set(e.pointerId,p);if(pointers.size===1){dragged=false;initial={...p,cell:e.target.closest('[data-cell]')?.dataset.cell}}else dragged=true;map.setPointerCapture(e.pointerId);map.classList.add('drag');map.focus({preventScroll:true})};
map.onpointermove=e=>{const old=pointers.get(e.pointerId);if(!old)return;const p=loc(e),other=[...pointers].find(([id])=>id!==e.pointerId)?.[1];if(other){dragged=true;const before=dist(old,other),after=dist(p,other);if(before>4&&after>4){zoomBy(after/before,(other.x+old.x)/2,(other.y+old.y)/2);const sc=camera.s*fitScale;camera.x-=(p.x-old.x)/2/sc;camera.y-=(p.y-old.y)/2/sc;clampPan();applyCamera()}}else{if(initial&&dist(p,initial)>4)dragged=true;if(dragged){camera.x-=(p.x-old.x)/(camera.s*fitScale);camera.y-=(p.y-old.y)/(camera.s*fitScale);clampPan();applyCamera()}}pointers.set(e.pointerId,p)};
function release(e,cancel=false){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(!pointers.size){map.classList.remove('drag');if(!cancel&&!dragged&&initial?.cell)choose(initial.cell,false);initial=null}}
map.onpointerup=e=>release(e);map.onpointercancel=e=>release(e,true);
map.addEventListener('wheel',e=>{e.preventDefault();const p=loc(e);zoomBy(Math.exp(Math.max(-.5,Math.min(.5,-e.deltaY*.002))),p.x,p.y)},{passive:false});
function neighbor(key){const v={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[key];const p=geometry[selected];let best=null,bestScore=Infinity;for(const [id,q] of Object.entries(geometry)){if(id===selected)continue;const dx=q.x-p.x,dy=q.y-p.y,f=dx*v[0]+dy*v[1],lat=Math.abs(dx*v[1]-dy*v[0]);if(f<=0||lat>f*1.52)continue;const score=Math.hypot(f,lat)+lat*.95;if(score<bestScore){best=id;bestScore=score}}return best}
map.onkeydown=e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;let used=true;if(e.key.startsWith('Arrow')){const n=neighbor(e.key);if(n){choose(n);if(camera.s>1.2||!nodeInsideView(n))center(n,false)}}else if(e.key==='+'||e.key==='=')zoomBy(1.3);else if(e.key==='-')zoomBy(1/1.3);else if(e.key==='Home')$('home').click();else if(e.key==='0')$('overview').click();else if(e.key==='Enter'||e.key===' '){const target=$('buy').disabled?$('ranks').querySelector('button[aria-pressed="true"]'):$('buy');target?.focus()}else used=false;if(used)e.preventDefault()};
const remembered=stored(store+'active');getPreset(D.presets.some(p=>p.id===remembered)?remembered:D.presets[0].id);new ResizeObserver(size).observe(map);
</script></body></html>
