  <script>
  (() => {
    const root=document.getElementById('honey-hex-book');
    if(!root)return;
    const {ranks,groups,pos,effect}=JSON.parse(root.querySelector('#hx-data').textContent);
    const rows=Object.fromEntries(ranks.map(row=>[row.id,row]));
    const select=root.querySelector('#hx-rank');
    const el=key=>root.querySelector('[data-'+key+']');
    const word={coins:'币',fiber:'纤维',resin:'树脂'};
    const price=row=>Object.entries(row.cost).filter(([,n])=>n).map(([k,n])=>n+' '+word[k]).join(' ＋ ');
    const option=(group,id,name)=>{const op=document.createElement('option');op.value=id;op.textContent=name;group.append(op)};
    option(select,'home','庭院蜂巢 · 出发');
    for(const [name,ids] of [...groups,['巢口',['reserve']]]){
      const group=document.createElement('optgroup');group.label=name;select.append(group);
      ids.forEach(id=>option(group,id,rows[id].name));
    }
    function drawLine(from,to,type){
      const overlay=root.querySelector('#hd-overlay');
      const [x,y]=pos[from],[u,v]=pos[to];
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      const detour={
        'twin-reserve':[495,132], 'wings2-reserve':[392,429], 'supply2-reserve':[163,328],
        'meadow-twin':[213,120], 'meadow-wings2':[275,464], 'meadow-supply2':[132,299],
        'gather1-reach':[390,165], 'gather1-supply1':[308,302], 'gather1-wings1':[427,326],
        'gather1-meadow':[290,207], 'gather2-meadow':[229,167], 'bag2-meadow':[417,500],
        'bag1-meadow':[392,265], 'wings1-meadow':[263,441], 'beat-meadow':[349,276],
        'reach-meadow':[360,121], 'supply1-meadow':[201,318],
      };
      const bend=detour[from+'-'+to];
      p.setAttribute('d','M '+x+' '+y+(bend?' Q '+bend[0]+' '+bend[1]:' L')+' '+u+' '+v);
      p.setAttribute('stroke','var(--foreground)');p.setAttribute('stroke-width','2.2');
      if(type==='any')p.setAttribute('stroke-dasharray','7 5');
      if(type==='count')p.setAttribute('stroke-dasharray','2 5');
      p.setAttribute('data-kind',type);p.setAttribute('data-from',from);p.setAttribute('data-to',to);overlay.append(p);
    }
    let selected='home';
    function show(id,save=false){
      if(id!=='home'&&!rows[id])id='home';
      select.value=id;selected=id;
      const home=id==='home',row=rows[id];
      const group=home||id==='reserve'?6:groups.findIndex(([,ids])=>ids.includes(id));
      const required=home?[]:row.requires_all;
      const any=home?[]:row.requires_any;
      const counted=home?[]:(row.requires_count?.from_purchased_ranks??[]);
      const sources=[...required,...any,...counted];
      root.querySelectorAll('.hx-sector').forEach(n=>n.classList.toggle('hx-chosen',Number(n.dataset.group)===group));
      root.querySelectorAll('.hx-node').forEach(n=>{
        n.classList.toggle('hx-chosen',n.dataset.pick===(home?'reserve':id));
        n.classList.toggle('hx-source',sources.includes(n.dataset.pick));
      });
      root.querySelector('#hd-overlay').replaceChildren();
      root.querySelector('.hx-base').setAttribute('opacity',home?'.66':'.14');
      if(!home){
        for(const a of required)drawLine(a,id,'all');
        for(const a of any)drawLine(a,id,'any');
        for(const a of counted)drawLine(a,id,'count');
        if(!sources.length)drawLine('reserve',id,'all');
      }
      el('price').textContent=home?'免费起点':price(row);
      el('effect').textContent=home?'第一次满载回巢，6 份蓝蜜卖 6 币。可以花 4 币采得更快，或用 6 币把蜜囊扩到 10 份。':effect[id];
      const clauses=[],names=ids=>ids.map(k=>rows[k].name).join('、');
      if(required.length)clauses.push('已购 '+names(required));
      if(any.length)clauses.push(names(any)+' 任选一项');
      if(counted.length)clauses.push('池岸八档任买三档（'+names(counted)+'）。同格两档计两次');
      if(row?.requires_world)clauses.push('已到过紫花地，累计交售至少 '+row.requires_world.min_lifetime_violet_sold+' 份紫蜜');
      el('pre').textContent=home?'选一个花格或方向查看；中心蜂巢也是最后封罐的地方。':clauses.length?'条件 · '+clauses.join('；'):'条件 · 新档即可购买。';
      const materials=['金币来自返巢卖蜜，蓝蜜每份 1 币、紫蜜每份 3 币。'];
      if(row?.cost.fiber)materials.push('纤维：池岸扇开成熟种穗，靠近接绒。');
      if(row?.cost.resin)materials.push('树脂：紫花地扇开树皮，贴近拉取。');
      el('source').textContent=home?'备粮后回到巢口，亲手封罐。':materials.join(' ');
      if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{rank:id},privateContent:null}).catch(()=>{});
    }
    root.addEventListener('click',event=>{
      const node=event.target.closest('[data-pick]');
      if(!node)return;
      show(node.dataset.pick,true);
    });
    select.addEventListener('change',()=>show(select.value,true));
    function saved(state){return state?.modelContent?.rank??state?.rank??'home'}
    show(saved(window.openai?.widgetState));
    window.addEventListener('openai:set_globals',e=>{const state=e.detail?.globals?.widgetState;if(state)show(saved(state))});
  })();
  </script>
