<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1144" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">Honey 成长树设计：从庭院出发，回巢封罐</title><desc id="desc">10 个付费花格含 14 个可购档。两翼是采集与振翅、载量与续航，中轴是花地、经营和储粮。开紫花地需要前期八档中任意三档。双簇采蜜、花源供给二档、双翼续航二档任一，再加曾到紫花地、交售六份紫蜜和六十币可备好花蜜。最后回巢亲手封罐。</desc><defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif} .num{font-variant-numeric:tabular-nums;}</style></defs><rect x="0" y="0" width="1320" height="1144" fill="#faf8f0" rx="0" /><text x="57" y="68" fill="#244037" font-size="46" font-weight="700" text-anchor="start">Honey</text><line x1="229" y1="29" x2="229" y2="68" stroke="#a3aca0" stroke-width="1" /><text x="255" y="64" fill="#324638" font-size="34" font-weight="600" text-anchor="start">成长树设计</text><text x="1264" y="53" fill="#586958" font-size="19" font-weight="500" text-anchor="end">v1  /  设计候选</text><text x="59" y="105" fill="#52624f" font-size="21" font-weight="500" text-anchor="start">10 个付费花格　·　14 个购买档　·　1 次巢口封罐</text><line x1="58" y1="126" x2="1262" y2="126" stroke="#c7cabc" stroke-width="1" /><path d="M 636 327 C 510 180 253 191 57 225 C 20 366 34 564 101 673 C 178 794 371 820 582 773 C 634 655 665 479 636 327 Z" fill="#e5ecdc" stroke="none" stroke-width="1" /><path d="M 684 327 C 810 180 1067 191 1263 225 C 1300 366 1286 564 1219 673 C 1142 794 949 820 738 773 C 686 655 655 479 684 327 Z" fill="#f4e6c9" stroke="none" stroke-width="1" /><path d="M 660 191 C 775 235 889 343 881 520 C 877 639 791 740 660 801 C 529 740 443 639 439 520 C 431 343 545 235 660 191 Z" fill="#eee8ec" stroke="none" stroke-width="1" /><g id="free-garden"><rect x="527" y="150" width="266" height="68" fill="#faf8f0" rx="34" stroke="#4f6454" stroke-width="2" /><path d="M 552 176 L 563 169 L 575 176 L 575 191 L 563 198 L 552 191 Z" fill="#f2cf80" stroke="#6e7047" stroke-width="1.6" /><text x="601" y="179" fill="#324638" font-size="23" font-weight="650" text-anchor="start">庭院蜂巢</text><text x="601" y="202" fill="#52624f" font-size="15" font-weight="500" text-anchor="start">起点 · 免费</text></g><text x="84" y="271" fill="#3c6245" font-size="28" font-weight="650" text-anchor="start">采集与振翅</text><text x="84" y="298" fill="#3c6245" font-size="17" font-weight="450" text-anchor="start">改变一处花湾里的动作</text><text x="488" y="271" fill="#69576e" font-size="28" font-weight="650" text-anchor="start">花地与经营</text><text x="488" y="298" fill="#69576e" font-size="17" font-weight="450" text-anchor="start">打开花地，经营蜜铺</text><text x="892" y="271" fill="#785620" font-size="28" font-weight="650" text-anchor="start">载量与续航</text><text x="892" y="298" fill="#785620" font-size="17" font-weight="450" text-anchor="start">多带一篮，或飞得更远</text><g id="gather"><path d="M100 326 H412 L428 342 V386 L412 402 H100 L84 386 V342 Z" fill="#f6f8ee" stroke="#8b9e76" stroke-width="1.6" stroke-linejoin="round" /><text x="102" y="358" fill="#365340" font-size="23" font-weight="650" text-anchor="start">采蜜技巧</text><text x="410" y="357" fill="#365340" font-size="17" font-weight="650" text-anchor="end">Ⅰ / Ⅱ</text><text x="102" y="385" fill="#425344" font-size="17" font-weight="450" text-anchor="start">采一份蜜　1.8 → 1.2 → 0.8 秒</text></g><g id="reach"><path d="M100 425 H412 L428 441 V485 L412 501 H100 L84 485 V441 Z" fill="#f6f8ee" stroke="#8b9e76" stroke-width="1.6" stroke-linejoin="round" /><text x="102" y="457" fill="#365340" font-size="23" font-weight="650" text-anchor="start">花香触角</text><text x="410" y="456" fill="#365340" font-size="17" font-weight="650" text-anchor="end">Ⅰ</text><text x="102" y="484" fill="#425344" font-size="17" font-weight="450" text-anchor="start">扩大采蜜与振翅的范围</text></g><g id="beat"><path d="M100 524 H412 L428 540 V584 L412 600 H100 L84 584 V540 Z" fill="#f6f8ee" stroke="#8b9e76" stroke-width="1.6" stroke-linejoin="round" /><text x="102" y="556" fill="#365340" font-size="23" font-weight="650" text-anchor="start">利落振翅</text><text x="410" y="555" fill="#365340" font-size="17" font-weight="650" text-anchor="end">Ⅰ</text><text x="102" y="583" fill="#425344" font-size="17" font-weight="450" text-anchor="start">紧壳一击；余风可碰到后方目标</text></g><g id="twin"><path d="M100 623 H412 L428 639 V683 L412 699 H100 L84 683 V639 Z" fill="#f6f8ee" stroke="#8b9e76" stroke-width="1.6" stroke-linejoin="round" /><text x="102" y="655" fill="#365340" font-size="23" font-weight="650" text-anchor="start">双簇采蜜</text><text x="410" y="654" fill="#365340" font-size="17" font-weight="650" text-anchor="end">Ⅰ</text><text x="102" y="682" fill="#425344" font-size="17" font-weight="450" text-anchor="start">在相邻两朵花上同时采蜜</text></g><g id="meadow"><path d="M504 326 H816 L832 342 V386 L816 402 H504 L488 386 V342 Z" fill="#faf5f9" stroke="#a695a6" stroke-width="1.6" stroke-linejoin="round" /><text x="506" y="358" fill="#61546a" font-size="23" font-weight="650" text-anchor="start">开往紫花地</text><text x="814" y="357" fill="#61546a" font-size="17" font-weight="650" text-anchor="end">Ⅰ</text><text x="506" y="385" fill="#425344" font-size="17" font-weight="450" text-anchor="start">前期 8 档任买 3 档，即可付费开路</text></g><g id="market"><path d="M504 457 H816 L832 473 V517 L816 533 H504 L488 517 V473 Z" fill="#faf5f9" stroke="#a695a6" stroke-width="1.6" stroke-linejoin="round" /><text x="506" y="489" fill="#61546a" font-size="23" font-weight="650" text-anchor="start">好口碑</text><text x="814" y="488" fill="#61546a" font-size="17" font-weight="650" text-anchor="end">Ⅰ</text><text x="506" y="516" fill="#425344" font-size="17" font-weight="450" text-anchor="start">每篮按基础货值加价 25%，向下取整</text></g><g id="supply"><path d="M504 623 H816 L832 639 V683 L816 699 H504 L488 683 V639 Z" fill="#faf5f9" stroke="#a695a6" stroke-width="1.6" stroke-linejoin="round" /><text x="506" y="655" fill="#61546a" font-size="23" font-weight="650" text-anchor="start">花源供给</text><text x="814" y="654" fill="#61546a" font-size="17" font-weight="650" text-anchor="end">Ⅰ / Ⅱ</text><text x="506" y="682" fill="#425344" font-size="17" font-weight="450" text-anchor="start">增花增材，补蜜　20 → 14 → 10 秒</text></g><g id="bag"><path d="M908 326 H1220 L1236 342 V386 L1220 402 H908 L892 386 V342 Z" fill="#fff7e8" stroke="#b69b64" stroke-width="1.6" stroke-linejoin="round" /><text x="910" y="358" fill="#6e501e" font-size="23" font-weight="650" text-anchor="start">蜜囊容量</text><text x="1218" y="357" fill="#6e501e" font-size="17" font-weight="650" text-anchor="end">Ⅰ / Ⅱ</text><text x="910" y="385" fill="#425344" font-size="17" font-weight="450" text-anchor="start">每趟最多装　6 → 10 → 16 份</text></g><g id="wings"><path d="M908 548 H1220 L1236 564 V608 L1220 624 H908 L892 608 V564 Z" fill="#fff7e8" stroke="#b69b64" stroke-width="1.6" stroke-linejoin="round" /><text x="910" y="580" fill="#6e501e" font-size="23" font-weight="650" text-anchor="start">双翼续航</text><text x="1218" y="579" fill="#6e501e" font-size="17" font-weight="650" text-anchor="end">Ⅰ / Ⅱ</text><text x="910" y="607" fill="#425344" font-size="17" font-weight="450" text-anchor="start">体力上限　36 → 50 → 70</text></g><path d="M 256 699 V 728 C 256 765 381 794 562 794" fill="none" stroke="#657b60" stroke-width="2.8" stroke-linecap="round" /><path d="M 660 699 V 767" fill="none" stroke="#657b60" stroke-width="2.8" stroke-linecap="round" /><path d="M 1064 624 V 728 C 1064 765 939 794 758 794" fill="none" stroke="#657b60" stroke-width="2.8" stroke-linecap="round" /><rect x="216" y="713" width="80" height="27" fill="#faf8f0" rx="13" /><text x="256" y="732" fill="#3f5a42" font-size="16" font-weight="600" text-anchor="middle">双簇 Ⅰ</text><rect x="620" y="718" width="80" height="27" fill="#faf8f0" rx="13" /><text x="660" y="737" fill="#3f5a42" font-size="16" font-weight="600" text-anchor="middle">供给 Ⅱ</text><rect x="1024" y="653" width="80" height="27" fill="#faf8f0" rx="13" /><text x="1064" y="672" fill="#3f5a42" font-size="16" font-weight="600" text-anchor="middle">双翼 Ⅱ</text><rect x="562" y="770" width="196" height="48" fill="#4a624c" rx="24" /><text x="660" y="802" fill="#ffffff" font-size="21" font-weight="600" text-anchor="middle">三项满足其一</text><line x1="660" y1="818" x2="660" y2="846" stroke="#596c55" stroke-width="3" /><path d="M 653 839 L 660 847 L 667 839" fill="none" stroke="#596c55" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><g id="reserve"><path d="M 405 850 H 915 L 932 868 V 916 L 915 934 H 405 L 388 916 V 868 Z" fill="#f3d99b" stroke="#97732b" stroke-width="2.4" /><text x="660" y="885" fill="#513e1c" font-size="29" font-weight="650" text-anchor="middle">备好花蜜  Ⅰ</text><text x="660" y="916" fill="#614c21" font-size="19" font-weight="500" text-anchor="middle">还需曾到紫花地、已交售 6 份紫蜜，以及 60 币</text></g><line x1="660" y1="934" x2="660" y2="962" stroke="#997735" stroke-width="2" /><path d="M 655 956 L 660 963 L 665 956" fill="none" stroke="#997735" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><g id="seal-hive"><rect x="497" y="966" width="326" height="60" fill="#faefd4" rx="30" stroke="#b69a60" stroke-width="1.5" /><text x="660" y="1004" fill="#674f23" font-size="22" font-weight="600" text-anchor="middle">到巢口亲手封罐 · 免费</text></g><line x1="58" y1="1048" x2="1262" y2="1048" stroke="#c7cabc" stroke-width="1" /><text x="59" y="1081" fill="#324638" font-size="18" font-weight="650" text-anchor="start">开路计数</text><text x="186" y="1081" fill="#324638" font-size="18" font-weight="450" text-anchor="start">采蜜技巧 Ⅰ、Ⅱ　·　花香触角　·　利落振翅　·　蜜囊容量 Ⅰ、Ⅱ　·　双翼续航 Ⅰ　·　花源供给 Ⅰ。</text><text x="59" y="1115" fill="#324638" font-size="18" font-weight="650" text-anchor="start">图例</text><text x="186" y="1115" fill="#324638" font-size="18" font-weight="450" text-anchor="start">罗马数字表示档次，同一花格的两档分别计数。底部连线表示储粮的任选条件，背景花瓣表示方位。</text></svg>