<rect x="987" y="150" width="385" height="625" rx="24" fill="#fffdf7"/>
<text x="1010" y="185" class="panel" >三种出行状态</text>
<text x="1010" y="230" class="tag" >晴日｜深处花圃丰盛</text>
<text x="1010" y="269" class="route" >0–1–2–5–7–2–1–0</text>
<text x="1010" y="305" class="small" >正面采蜜上行，回坡绕回。</text>
<text x="1010" y="400" class="tag" >细雨｜背坡遮雨线</text>
<text x="1010" y="439" class="route" >0–1–3–4–5，沿原路返</text>
<text x="1010" y="475" class="small" >正面更暴露；背路仍有露天间隔。</text>
<text x="1010" y="570" class="tag" >变体｜花篱缺口移位（候选）</text>
<text x="1010" y="609" class="route" >关闭2–5；改为2–4</text>
<text x="1010" y="645" class="small" >0–1–2–4–6–5–7–2–1–0</text>
<text x="1010" y="745" class="small" >状态在入区时固定；途中不重排。</text>
<rect x="28" y="800" width="1344" height="136" rx="22" fill="#fffdf7"/>
<line x1="52" y1="831" x2="105" y2="831" stroke="#2c7b8e" stroke-width="5" stroke-dasharray="12 8"/>
