<text x="870" y="585" class="node" text-anchor="middle">材料侧湾</text>
<text x="870" y="613" class="small" text-anchor="middle">远端支路</text>
<rect x="987" y="150" width="385" height="625" rx="24" fill="#fffdf7"/>
<text x="1010" y="185" class="panel" >三种出行状态</text>
<text x="1010" y="230" class="tag" >晴日｜远岸花盛</text>
<text x="1010" y="269" class="route" >主线 0–1–3–4–5–6–1–0</text>
<text x="1010" y="305" class="small" >走远岸环，材料侧湾可选。</text>
<text x="1010" y="400" class="tag" >细雨｜遮雨路线更有价值</text>
<text x="1010" y="439" class="route" >0–1–6–5–4，沿原路返</text>
<text x="1010" y="475" class="small" >3–4更暴露；5–6有分段叶棚。</text>
<text x="1010" y="570" class="tag" >变体｜苇廊改接（候选）</text>
<text x="1010" y="609" class="route" >关闭3–4；改为2–4</text>
<text x="1010" y="645" class="small" >0–1–2–4–5–6–1–0</text>
<text x="1010" y="745" class="small" >状态在入区时固定；途中不重排。</text>
<rect x="28" y="800" width="1344" height="136" rx="22" fill="#fffdf7"/>
<line x1="52" y1="831" x2="105" y2="831" stroke="#2c7b8e" stroke-width="5" stroke-dasharray="12 8"/>
<text x="120" y="838" class="tag" >成长前：近场回路</text>
<text x="52" y="874" class="route" >0–1–2–3–1–0</text>
<text x="52" y="909" class="small" >近场采集完整回巢</text>
<line x1="410" y1="831" x2="465" y2="831" stroke="#ce722e" stroke-width="8"/>
<text x="480" y="838" class="tag" >成长后：组合远端目标</text>
<text x="410" y="874" class="route" >0–1–3–4–5–7–6–1–0</text>
<text x="410" y="909" class="small" >远岸＋材料支路，再走回接</text>
<line x1="955" y1="831" x2="1005" y2="831" stroke="#8760a4" stroke-width="4" stroke-dasharray="5 8"/>
<text x="1020" y="838" class="tag" >变体新增连接</text>
<text x="955" y="874" class="small" >成长改变行程预算，不凭空开墙。</text>
<text x="955" y="909" class="small" >真实尺寸、耗时及返程余量待验证。</text>
<text x="35" y="959" class="small" >成长线为晴日基础布局示例。水面不作空气墙；通路需用实体植被组织，碰撞轮廓待灰盒验证。</text>
