<text x="35" y="90" class="sub" >入口湾 → 芦苇岔口 → 内湾或沿岸 → 远岸目标 → 回接</text>
<text x="35" y="124" class="small" >8个相连景段 · 入口不显示全区 · 非等比例候选，实际尺寸待验证</text>
