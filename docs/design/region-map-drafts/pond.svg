<text x="620" y="693" class="small" text-anchor="middle">固定回接</text>
<rect x="792" y="553" width="156" height="74" rx="22" fill="#fff1cd" stroke="#829177" stroke-width="2"/>
<circle cx="804" cy="558" r="17" fill="#485f4e"/>
