<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>键位设置 · 振翅</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #203b32; color: #fff2cf; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { width: min(96vw, 650px, 110vh); aspect-ratio: 557 / 490; position: relative; background: url("../../../../prototypes/swarm-flight/art/honey-menu-settings.webp") center / 100% 100% no-repeat; }
  .inside { position: absolute; inset: 14% 17% 21%; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
  h1 { margin: 0; font-size: clamp(18px, 4vw, 28px); font-weight: 550; letter-spacing: .06em; }
  .wax { background: url("controls-wax-q.png") left center / 200% 100% no-repeat; }
  main[data-state="down"] .wax { background-position: right center; }
  .enlarged { display: block; width: clamp(64px, 18vw, 134px); aspect-ratio: 1; }
  .binding { width: min(100%, 242px); height: 31px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; font-size: 18px; }
  button { padding: 0; border: 0; border-radius: 5px; color: inherit; touch-action: none; user-select: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid #ffe2a0; outline-offset: 2px; }
  #key { width: 31px; height: 31px; justify-self: center; }
  .binding > span { justify-self: center; }
  p { margin: 0; text-align: center; line-height: 1.55; font-size: clamp(12px, 2.5vw, 16px); }
</style>
<main data-state="up">
  <div class="inside">
    <h1>键位设置</h1>
    <button class="wax enlarged" type="button" aria-label="放大试按振翅键 Q"></button>
    <div class="binding"><span>振翅</span><button id="key" class="wax" type="button" data-state="up" aria-label="试按振翅键 Q"></button></div>
    <p>按住 Q 或点住键帽，松开回弹</p>
  </div>
</main>
<script>
  const key = document.querySelector('#key');
  const panel = document.querySelector('main');
  const held = new Set();
  function showState() {
    key.dataset.state = panel.dataset.state = held.size ? 'down' : 'up';
  }
  function clearInputs() { held.clear(); showState(); }
  function useKeyboard(event, down) {
    const q = event.key.toLowerCase() === 'q';
    const activate = document.activeElement?.matches('button.wax') && ['Enter', ' '].includes(event.key);
    const id = 'key-' + event.code;
    if (!down && held.has(id)) { held.delete(id); showState(); return; }
    if ((!q && !activate) || event.ctrlKey || event.altKey || event.metaKey) return;
    event.preventDefault();
    if (down) held.add(id); else held.delete(id);
    showState();
  }
  window.addEventListener('keydown', event => useKeyboard(event, true));
  window.addEventListener('keyup', event => useKeyboard(event, false));
  function releasePointer(event) { held.delete(event.pointerId); showState(); }
  for (const button of panel.querySelectorAll('button.wax')) {
    button.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      button.setPointerCapture(event.pointerId);
      held.add(event.pointerId);
      showState();
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) button.addEventListener(type, releasePointer);
  }
  window.addEventListener('blur', clearInputs);
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearInputs(); });
</script>
</html>
