name: Desktop client builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag recorded in internal-candidate artifact names and an optional internal prerelease
        required: true
        default: v0.9.5-rc.2
        type: string
      publish_prerelease:
        description: Publish non-distribution-signed/unnotarized internal candidates after both packages pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.6.2
  GODOT_RELEASE: 4.6.2-stable
  TEMPLATE_ARCHIVE: Godot_v4.6.2-stable_export_templates.tpz

jobs:
  validate:
    name: Validate requested version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Match workflow tag to project version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          project_version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$project_version"

  macos:
    name: macOS universal internal candidate
    needs: validate
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Download and verify Godot and export templates
        working-directory: ${{ runner.temp }}
        run: |
          editor_archive=Godot_v${GODOT_RELEASE}_macos.universal.zip
          sums_url=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/SHA512-SUMS.txt
          release_url=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl --fail --silent --show-error --location --output SHA512-SUMS.txt "$sums_url"
          for archive in "$editor_archive" "$TEMPLATE_ARCHIVE"; do
            curl --fail --silent --show-error --location --output "$archive" "$release_url/$archive"
            grep " $archive$" SHA512-SUMS.txt | shasum -a 512 --check
          done
          unzip -q "$editor_archive" -d godot-bin
          unzip -q "$TEMPLATE_ARCHIVE" -d template-archive
          template_dir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          cp -R template-archive/templates/. "$template_dir/"
      - name: Run Godot tests
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot.app/Contents/MacOS/Godot
        run: npm run test:godot
      - name: Export, ad-hoc sign and verify macOS internal candidate
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot.app/Contents/MacOS/Godot
        run: |
          node scripts/generate_build_provenance.mjs
          mkdir -p builds
          ./scripts/with_commercial_godot_cache.sh \
            "$GODOT_BIN" --path godot --headless --export-release macOS \
            "$GITHUB_WORKSPACE/builds/SeeYouAtTheHive-macOS.zip"
          ./scripts/package_macos.sh
          unzip -q builds/SeeYouAtTheHive-macOS.zip -d "$RUNNER_TEMP/macos-verify"
          macos_app="$RUNNER_TEMP/macos-verify/一会儿巢里见.app"
          macos_binary="$macos_app/Contents/MacOS/一会儿巢里见"
          test -x "$macos_binary"
          lipo "$macos_binary" -archs
          lipo "$macos_binary" -verify_arch arm64 x86_64
          ./scripts/verify_godot_export_contents.sh --pack "$macos_app/Contents/Resources/一会儿巢里见.pck"
          codesign --verify --deep --strict --verbose=2 "$macos_app"
          (cd builds && shasum -a 256 SeeYouAtTheHive-macOS.zip > SeeYouAtTheHive-macOS.zip.sha256)
          node scripts/generate_artifact_manifest.mjs \
            --artifact builds/SeeYouAtTheHive-macOS.zip \
            --platform macos-universal \
            --source-ref "$GITHUB_REF" \
            --github-run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: SeeYouAtTheHive-macOS-InternalCandidate-${{ inputs.release_tag }}
          path: |
            builds/SeeYouAtTheHive-macOS.zip
            builds/SeeYouAtTheHive-macOS.zip.sha256
            builds/SeeYouAtTheHive-macOS.zip.manifest.json
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x86_64 unsigned internal candidate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Download and verify Godot and export templates
        working-directory: ${{ runner.temp }}
        run: |
          editor_archive=Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          sums_url=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/SHA512-SUMS.txt
          release_url=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl --fail --silent --show-error --location --output SHA512-SUMS.txt "$sums_url"
          for archive in "$editor_archive" "$TEMPLATE_ARCHIVE"; do
            curl --fail --silent --show-error --location --output "$archive" "$release_url/$archive"
            grep " $archive$" SHA512-SUMS.txt | sha512sum --check --strict
          done
          unzip -q "$editor_archive" -d godot-bin
          unzip -q "$TEMPLATE_ARCHIVE" -d template-archive
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          cp -R template-archive/templates/. "$template_dir/"
      - name: Run Godot tests
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        run: npm run test:godot
      - name: Export and verify unsigned Windows internal candidate
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        run: |
          node scripts/generate_build_provenance.mjs
          mkdir -p builds
          ./scripts/with_commercial_godot_cache.sh \
            "$GODOT_BIN" --path godot --headless --export-release "Windows Desktop" \
            "$GITHUB_WORKSPACE/builds/SeeYouAtTheHive-Windows.exe"
          test -s builds/SeeYouAtTheHive-Windows.exe
          file builds/SeeYouAtTheHive-Windows.exe | grep 'PE32+ executable.*x86-64'
          ./scripts/verify_godot_export_contents.sh --pack builds/SeeYouAtTheHive-Windows.exe
          (cd builds && sha256sum SeeYouAtTheHive-Windows.exe > SeeYouAtTheHive-Windows.exe.sha256)
          node scripts/generate_artifact_manifest.mjs \
            --artifact builds/SeeYouAtTheHive-Windows.exe \
            --platform windows-x86_64 \
            --source-ref "$GITHUB_REF" \
            --github-run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: SeeYouAtTheHive-Windows-InternalCandidate-${{ inputs.release_tag }}
          path: |
            builds/SeeYouAtTheHive-Windows.exe
            builds/SeeYouAtTheHive-Windows.exe.sha256
            builds/SeeYouAtTheHive-Windows.exe.manifest.json
          if-no-files-found: error
          retention-days: 30

  prerelease:
    name: Publish non-distribution-signed/unnotarized internal prerelease
    if: inputs.publish_prerelease && github.ref == 'refs/heads/main'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SeeYouAtTheHive-*-InternalCandidate-${{ inputs.release_tag }}
          merge-multiple: true
          path: release-assets
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --generate-notes \
            --title "一会儿巢里见 $RELEASE_TAG · 内部候选（未做商业发行签名／公证）"
