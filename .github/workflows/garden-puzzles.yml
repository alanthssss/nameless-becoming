name: Garden Puzzles prototype

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Garden Puzzles rules and complete routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GODOT_RELEASE: 4.6.2-stable
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot and verify SHA-512
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl --fail --silent --show-error --location --output "$GODOT_ARCHIVE" "$release_url/$GODOT_ARCHIVE"
          curl --fail --silent --show-error --location --output SHA512-SUMS.txt "$release_url/SHA512-SUMS.txt"
          awk -v archive="$GODOT_ARCHIVE" '$2 == archive {print; found++} END {if (found != 1) exit 1}' SHA512-SUMS.txt > selected.sha512
          sha512sum --check --strict selected.sha512
          unzip -q "$GODOT_ARCHIVE" -d godot-bin
      - name: Import isolated prototype
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/garden-puzzles --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/garden-puzzles-import.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/garden-puzzles-import.log"; then
            exit 1
          fi
      - name: Verify rules and replay complete chapter routes
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/garden-puzzles --script res://verify.gd 2>&1 | tee "$RUNNER_TEMP/garden-puzzles-verify.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/garden-puzzles-verify.log"; then
            exit 1
          fi
          grep -q '^GARDEN PUZZLES RULES VERIFIED:' "$RUNNER_TEMP/garden-puzzles-verify.log"
      - name: Play the complete scene flow and recovery controls
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/garden-puzzles --script res://ui_verify.gd 2>&1 | tee "$RUNNER_TEMP/garden-puzzles-ui.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/garden-puzzles-ui.log"; then
            exit 1
          fi
          grep -q '^GARDEN PUZZLES UI VERIFIED:' "$RUNNER_TEMP/garden-puzzles-ui.log"
      - name: Start the main scene
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/garden-puzzles --quit-after 3 2>&1 | tee "$RUNNER_TEMP/garden-puzzles-main.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/garden-puzzles-main.log"; then
            exit 1
          fi
