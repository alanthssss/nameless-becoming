name: Quality gates

on:
  pull_request:
    # Include retargeting. Other PR edits conservatively rerun the same scope;
    # a skipped same-SHA check must not overwrite an earlier failed gate.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # New PR commits supersede old PR checks. Main commits are independent:
  # a docs-only push must not cancel tests required by the previous push.
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Change scope and lightweight CI checks
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
      godot: ${{ steps.changes.outputs.godot }}
      export_game: ${{ steps.changes.outputs.export_game }}
      godot_suite: ${{ steps.changes.outputs.godot_suite }}
      swarm: ${{ steps.changes.outputs.swarm }}
      flower: ${{ steps.changes.outputs.flower }}
      garden: ${{ steps.changes.outputs.garden }}
      content: ${{ steps.changes.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes and check whitespace
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          bash -n scripts/classify_ci_changes.sh scripts/ci_scope.sh scripts/lint_workflows.sh
          bash tests/ci-scope.test.sh
          python3 -B -m unittest discover -s tests -p test_ci_routing.py
          bash scripts/lint_workflows.sh
          classified=$(bash scripts/ci_scope.sh)
          printf '%s\n' "$classified" >> "$GITHUB_OUTPUT"
          printf 'Selected checks:\n```\n%s\n```\n' "$classified" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web build, tests and lint
    timeout-minutes: 15
    needs: scope
    if: ${{ needs.scope.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The final autumn A/B deliberately reads its pinned pre-candidate
          # WAVs from history; a depth-1 PR checkout cannot reproduce it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install standards-grade audio meter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:art-review

  godot:
    name: Godot 4.6.2 tests
    needs: scope
    if: ${{ needs.scope.outputs.godot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GODOT_VERSION: 4.6.2
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Download and verify Godot
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            --output "$GODOT_ARCHIVE" \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/$GODOT_ARCHIVE"
          curl --fail --silent --show-error --location \
            --output SHA512-SUMS.txt \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/SHA512-SUMS.txt"
          grep " $GODOT_ARCHIVE$" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$GODOT_ARCHIVE" -d godot-bin
      - name: Run Godot tests
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          GODOT_TEST_SCOPE: ${{ needs.scope.outputs.godot_suite }}
        run: npm run test:godot
      - name: Verify exported resource boundaries
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        run: npm run verify:godot-export

  web-candidate:
    name: Clean Web game and site candidate
    needs: [scope, web, godot]
    if: ${{ always() && needs.scope.outputs.export_game == 'true' && needs.web.result == 'success' && needs.godot.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.6.2
      GODOT_RELEASE: 4.6.2-stable
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      TEMPLATE_ARCHIVE: Godot_v4.6.2-stable_export_templates.tpz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Download and verify Godot Web exporter
        working-directory: ${{ runner.temp }}
        run: |
          release_url=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl --fail --silent --show-error --location --output SHA512-SUMS.txt "$release_url/SHA512-SUMS.txt"
          for archive in "$GODOT_ARCHIVE" "$TEMPLATE_ARCHIVE"; do
            curl --fail --silent --show-error --location --output "$archive" "$release_url/$archive"
            grep " $archive$" SHA512-SUMS.txt | sha512sum --check --strict
          done
          unzip -q "$GODOT_ARCHIVE" -d godot-bin
          unzip -q "$TEMPLATE_ARCHIVE" -d template-archive
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          cp -R template-archive/templates/. "$template_dir/"
      - name: Export verified Web game and build launch site
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        run: |
          npm run build:web-game
          npm run build
          node --test tests/rendered-html.test.mjs
          test -s dist/server/index.js
      # Daily CI validates the export without retaining a candidate download.
      # Create shareable packages only through an explicitly requested build.

  content:
    name: Document and material contracts
    needs: scope
    if: ${{ needs.scope.outputs.content == 'true' && needs.scope.outputs.web != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node --test tests/commercial-outward-copy.test.mjs tests/art-review.test.mjs

  swarm:
    name: Swarm Flight
    needs: scope
    if: ${{ needs.scope.outputs.swarm == 'true' }}
    uses: ./.github/workflows/swarm-flight.yml

  flower:
    name: Flower Step
    needs: scope
    if: ${{ needs.scope.outputs.flower == 'true' }}
    uses: ./.github/workflows/flower-step.yml

  garden:
    name: Garden Puzzles
    needs: scope
    if: ${{ needs.scope.outputs.garden == 'true' }}
    uses: ./.github/workflows/garden-puzzles.yml

  required:
    name: CI required checks
    needs: [scope, web, godot, web-candidate, content, swarm, flower, garden]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require success for every selected check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/check_ci_results.py

  swarm-gate:
    # Keep the original top-level check name for existing check consumers.
    name: Swarm Flight rules and complete routes
    needs: [scope, swarm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require the selected Swarm Flight suite
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/check_ci_results.py --only swarm
