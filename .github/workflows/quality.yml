name: Quality gates

on:
  pull_request:
    # Keep the protected status current for edits, including retargeting.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # New PR commits supersede old PR checks. Main commits are independent:
  # a docs-only push must not cancel tests required by the previous push.
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base || !(github.event.changes.title || github.event.changes.body)) }}

permissions:
  contents: read

jobs:
  scope:
    permissions:
      contents: read
      actions: read
    name: Change scope and lightweight CI checks
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      lightweight: ${{ steps.discussion.outputs.handled }}
      reused: ${{ steps.reuse.outputs.reused }}
      source_run: ${{ steps.reuse.outputs.source_run }}
      tested_tree: ${{ steps.reuse.outputs.tested_tree }}
      web: ${{ steps.changes.outputs.web }}
      godot: ${{ steps.changes.outputs.godot }}
      export_game: ${{ steps.changes.outputs.export_game }}
      godot_suite: ${{ steps.changes.outputs.godot_suite }}
      swarm: ${{ steps.changes.outputs.swarm }}
      swarm_suite: ${{ steps.changes.outputs.swarm_suite }}
      flower: ${{ steps.changes.outputs.flower }}
      garden: ${{ steps.changes.outputs.garden }}
      content: ${{ steps.changes.outputs.content }}
    steps:
      - name: Check previous results or discussion documents without checkout
        id: discussion
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKER_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Changes to the checker must first pass the previous revision's routing.
          script="$RUNNER_TEMP/ci_discussion.py"
          if gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/scripts/ci_discussion.py?ref=$CHECKER_REV" > "$script"; then
            python3 -B "$script"
          else
            echo 'Using checkout because the discussion checker is unavailable.'
          fi

      - uses: actions/checkout@v4
        if: steps.discussion.outputs.handled != 'true'
        with:
          fetch-depth: 0
      - name: Classify changes and check whitespace
        id: changes
        if: steps.discussion.outputs.handled != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          bash -n scripts/classify_ci_changes.sh scripts/ci_scope.sh scripts/lint_workflows.sh
          bash tests/ci-scope.test.sh
          python3 -B -m unittest discover -s tests -p test_ci_routing.py
          python3 -B -m unittest discover -s tests -p test_ci_discussion.py
          bash scripts/lint_workflows.sh
          classified=$(bash scripts/ci_scope.sh)
          printf '%s\n' "$classified" >> "$GITHUB_OUTPUT"
          printf 'Selected checks:\n```\n%s\n```\n' "$classified" >> "$GITHUB_STEP_SUMMARY"

      - name: Test synchronization and reuse contracts on full CI runs
        # Routing changes, unknown inputs and manual full checks select all four.
        if: >-
          steps.changes.outputs.export_game == 'true' && steps.changes.outputs.swarm == 'true' &&
          steps.changes.outputs.flower == 'true' && steps.changes.outputs.garden == 'true'
        run: python3 -B -m unittest discover -s tests -p test_ci_reuse.py

      - name: Check previous results after synchronizing main
        id: reuse
        if: steps.discussion.outputs.handled != 'true'
        env:
          CI_SELECTION: ${{ toJSON(steps.changes.outputs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci_reuse.py

      - name: Verify this checkout's build identity when reusing build checks
        if: >-
          steps.discussion.outputs.handled != 'true' && (
          contains(fromJSON(steps.reuse.outputs.reused), 'web') ||
          contains(fromJSON(steps.reuse.outputs.reused), 'godot') ||
          contains(fromJSON(steps.reuse.outputs.reused), 'web-candidate'))
        env:
          NAMELESS_BUILD_INFO_PATH: ${{ runner.temp }}/ci-build-identity.json
        run: |
          node scripts/generate_build_provenance.mjs
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          stamp = json.loads(Path(os.environ["NAMELESS_BUILD_INFO_PATH"]).read_bytes())
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          version = json.loads(Path("package.json").read_bytes())["version"]
          if checkout != os.environ["GITHUB_SHA"] or stamp != {
              "schema_version": 1, "product_version": version, "commit": checkout, "dirty": False,
          }:
              raise SystemExit("Build identity does not match this clean checkout")
          PY

  web:
    name: Web build, tests and lint
    timeout-minutes: 15
    needs: scope
    if: ${{ needs.scope.outputs.web == 'true' && !contains(fromJSON(needs.scope.outputs.reused), 'web') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The final autumn A/B deliberately reads its pinned pre-candidate
          # WAVs from history; a depth-1 PR checkout cannot reproduce it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install standards-grade audio meter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:art-review

  godot:
    name: Godot 4.6.2 tests
    needs: scope
    if: ${{ needs.scope.outputs.godot == 'true' && !contains(fromJSON(needs.scope.outputs.reused), 'godot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GODOT_VERSION: 4.6.2
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Download and verify Godot
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            --output "$GODOT_ARCHIVE" \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/$GODOT_ARCHIVE"
          curl --fail --silent --show-error --location \
            --output SHA512-SUMS.txt \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/SHA512-SUMS.txt"
          grep " $GODOT_ARCHIVE$" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$GODOT_ARCHIVE" -d godot-bin
      - name: Run Godot tests
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          GODOT_TEST_SCOPE: ${{ needs.scope.outputs.godot_suite }}
        run: npm run test:godot
      - name: Verify exported resource boundaries
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        run: npm run verify:godot-export

  web-candidate:
    name: Clean Web game and site candidate
    needs: [scope, web, godot]
    if: >-
      always() && needs.scope.result == 'success' && needs.scope.outputs.export_game == 'true' &&
      !contains(fromJSON(needs.scope.outputs.reused), 'web-candidate') &&
      (needs.web.result == 'success' || (needs.web.result == 'skipped' && contains(fromJSON(needs.scope.outputs.reused), 'web'))) &&
      (needs.godot.result == 'success' || (needs.godot.result == 'skipped' && contains(fromJSON(needs.scope.outputs.reused), 'godot')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.6.2
      GODOT_RELEASE: 4.6.2-stable
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      TEMPLATE_ARCHIVE: Godot_v4.6.2-stable_export_templates.tpz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Download and verify Godot Web exporter
        working-directory: ${{ runner.temp }}
        run: |
          release_url=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl --fail --silent --show-error --location --output SHA512-SUMS.txt "$release_url/SHA512-SUMS.txt"
          for archive in "$GODOT_ARCHIVE" "$TEMPLATE_ARCHIVE"; do
            curl --fail --silent --show-error --location --output "$archive" "$release_url/$archive"
            grep " $archive$" SHA512-SUMS.txt | sha512sum --check --strict
          done
          unzip -q "$GODOT_ARCHIVE" -d godot-bin
          unzip -q "$TEMPLATE_ARCHIVE" -d template-archive
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          cp -R template-archive/templates/. "$template_dir/"
      - name: Export verified Web game and build launch site
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        run: |
          npm run build:web-game
          npm run build
          node --test tests/rendered-html.test.mjs
          test -s dist/server/index.js
      # Daily CI validates the export without retaining a candidate download.
      # Create shareable packages only through an explicitly requested build.

  content:
    name: Document and material contracts
    needs: scope
    if: ${{ needs.scope.outputs.content == 'true' && needs.scope.outputs.web != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node --test tests/commercial-outward-copy.test.mjs tests/art-review.test.mjs

  swarm:
    name: Swarm Flight
    needs: scope
    if: ${{ needs.scope.outputs.swarm == 'true' && !contains(fromJSON(needs.scope.outputs.reused), 'swarm') }}
    uses: ./.github/workflows/swarm-flight.yml
    with:
      suite: ${{ contains(fromJSON(needs.scope.outputs.reused), 'swarm-except-region') && 'region' || needs.scope.outputs.swarm_suite }}

  flower:
    name: Flower Step
    needs: scope
    if: ${{ needs.scope.outputs.flower == 'true' && !contains(fromJSON(needs.scope.outputs.reused), 'flower') }}
    uses: ./.github/workflows/flower-step.yml

  garden:
    name: Garden Puzzles
    needs: scope
    if: ${{ needs.scope.outputs.garden == 'true' && !contains(fromJSON(needs.scope.outputs.reused), 'garden') }}
    uses: ./.github/workflows/garden-puzzles.yml

  required:
    name: CI required checks
    needs: [scope, web, godot, web-candidate, content, swarm, flower, garden]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the lightweight check succeeded and all suites were skipped
        if: needs.scope.outputs.lightweight == 'true'
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'keys == ["content", "flower", "garden", "godot", "scope", "swarm", "web", "web-candidate"]
            and .scope.result == "success"
            and (del(.scope) | all(.[]; .result == "skipped"))' <<< "$RESULTS"

      - uses: actions/checkout@v4
        if: needs.scope.outputs.lightweight != 'true'
      - name: Require success for every selected check
        if: needs.scope.outputs.lightweight != 'true'
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/check_ci_results.py

      # Immutable job metadata identifies the real integrated tree and certified coverage.
      - name: Prototype evidence v1 PR ${{ github.event.pull_request.number }} base ${{ github.event.pull_request.base.sha }} tree ${{ needs.scope.outputs.tested_tree }} swarm ${{ needs.scope.outputs.swarm_suite }} flower ${{ needs.scope.outputs.flower }} garden ${{ needs.scope.outputs.garden }}
        if: ${{ needs.scope.outputs.lightweight != 'true' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: echo "Prototype results verified by the required gate."

      - name: Build evidence v1 PR ${{ github.event.pull_request.number }} base ${{ github.event.pull_request.base.sha }} tree ${{ needs.scope.outputs.tested_tree }} web ${{ needs.scope.outputs.web }} godot ${{ needs.scope.outputs.godot == 'true' && needs.scope.outputs.godot_suite || 'none' }} export ${{ needs.scope.outputs.export_game }}
        if: ${{ needs.scope.outputs.lightweight != 'true' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: echo "Web, Godot and clean export coverage verified by the required gate."

      - name: Gate outcome v1 PR ${{ github.event.pull_request.number }} base ${{ github.event.pull_request.base.ref }} ${{ github.event.pull_request.base.sha }} merge ${{ github.sha }}
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: echo "Record the exact comparison for subsequent PR text edits."

  swarm-gate:
    # Keep the original top-level check name for existing check consumers.
    name: Swarm Flight rules and complete routes
    needs: [scope, swarm]
    if: ${{ always() && needs.scope.outputs.lightweight != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require the selected Swarm Flight suite
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/check_ci_results.py --only swarm
