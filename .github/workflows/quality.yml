name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scope:
    name: Change scope and documentation checks
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.changes.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes and check whitespace
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          zero_sha=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            diff_spec="$base_sha...$head_sha"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$CURRENT_SHA"
            diff_spec="$base_sha..$head_sha"
          fi

          full_ci=true
          if (
            [[ -n "$base_sha" ]]
            [[ -n "$head_sha" ]]
            [[ "$base_sha" != "$zero_sha" ]]
            git cat-file -e "$base_sha^{commit}"
            git cat-file -e "$head_sha^{commit}"
          ); then
            if classified="$(
              # Disable rename detection so both sides of a rename are
              # classified; moving source code to a .md path must run full CI.
              git diff --name-only -z --no-renames "$diff_spec" \
                | bash scripts/classify_ci_changes.sh
            )"; then
              case "$classified" in
                true|false) full_ci="$classified" ;;
                *) full_ci=true ;;
              esac
            fi
            git diff --check "$diff_spec"
          else
            # A missing/all-zero base occurs on unusual history events. Keep the
            # gate safe by running full CI and at least checking the head commit.
            git show --check --format= "$head_sha"
          fi

          printf 'full_ci=%s\n' "$full_ci" >> "$GITHUB_OUTPUT"
          if [[ "$full_ci" == "true" ]]; then
            printf 'Full Web, Godot, and clean-export CI required.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Markdown-only change: heavy CI jobs are skipped.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  web:
    name: Web build, tests and lint
    needs: scope
    if: ${{ needs.scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The final autumn A/B deliberately reads its pinned pre-candidate
          # WAVs from history; a depth-1 PR checkout cannot reproduce it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install standards-grade audio meter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm test

  godot:
    name: Godot 4.6.2 tests
    needs: scope
    if: ${{ needs.scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GODOT_VERSION: 4.6.2
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Download and verify Godot
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            --output "$GODOT_ARCHIVE" \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/$GODOT_ARCHIVE"
          curl --fail --silent --show-error --location \
            --output SHA512-SUMS.txt \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/SHA512-SUMS.txt"
          grep " $GODOT_ARCHIVE$" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$GODOT_ARCHIVE" -d godot-bin
      - name: Run Godot tests
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        run: npm run test:godot
      - name: Verify exported resource boundaries
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        run: npm run verify:godot-export

  web-candidate:
    name: Clean Web game and site candidate
    needs: [scope, web, godot]
    if: ${{ always() && needs.scope.outputs.full_ci == 'true' && needs.web.result == 'success' && needs.godot.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.6.2
      GODOT_RELEASE: 4.6.2-stable
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      TEMPLATE_ARCHIVE: Godot_v4.6.2-stable_export_templates.tpz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Download and verify Godot Web exporter
        working-directory: ${{ runner.temp }}
        run: |
          release_url=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl --fail --silent --show-error --location --output SHA512-SUMS.txt "$release_url/SHA512-SUMS.txt"
          for archive in "$GODOT_ARCHIVE" "$TEMPLATE_ARCHIVE"; do
            curl --fail --silent --show-error --location --output "$archive" "$release_url/$archive"
            grep " $archive$" SHA512-SUMS.txt | sha512sum --check --strict
          done
          unzip -q "$GODOT_ARCHIVE" -d godot-bin
          unzip -q "$TEMPLATE_ARCHIVE" -d template-archive
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          cp -R template-archive/templates/. "$template_dir/"
      - name: Export verified Web game and build launch site
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        run: |
          npm run build:web-game
          npm run build
          node --test tests/rendered-html.test.mjs
          test -s dist/server/index.js
      - uses: actions/upload-artifact@v4
        with:
          name: SeeYouAtTheHive-Web-InternalCandidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
