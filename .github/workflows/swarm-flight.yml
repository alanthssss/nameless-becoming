name: Swarm Flight prototype

on:
  pull_request:
    paths:
      - 'prototypes/swarm-flight/**'
      - 'scripts/check_swarm_regressions.py'
      - 'scripts/check_swarm_supply_regressions.py'
      - 'tests/test_swarm_regressions.py'
      - 'tools/check_delivery.py'
      - 'tests/test_delivery_gate.py'
      - '.github/workflows/swarm-flight.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/swarm-flight/**'
      - 'scripts/check_swarm_regressions.py'
      - 'scripts/check_swarm_supply_regressions.py'
      - 'tests/test_swarm_regressions.py'
      - 'tools/check_delivery.py'
      - 'tests/test_delivery_gate.py'
      - '.github/workflows/swarm-flight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-flight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Swarm Flight rules and complete routes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GODOT_RELEASE: 4.6.2-stable
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot and verify SHA-512
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl --fail --silent --show-error --location --output "$GODOT_ARCHIVE" "$release_url/$GODOT_ARCHIVE"
          curl --fail --silent --show-error --location --output SHA512-SUMS.txt "$release_url/SHA512-SUMS.txt"
          awk -v archive="$GODOT_ARCHIVE" '$2 == archive {print; found++} END {if (found != 1) exit 1}' SHA512-SUMS.txt > selected.sha512
          sha512sum --check --strict selected.sha512
          unzip -q "$GODOT_ARCHIVE" -d godot-bin
      - name: Import isolated prototype
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/swarm-flight-import.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-import.log"; then
            exit 1
          fi
      - name: Verify rules and replay complete chapter routes
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://verify.gd 2>&1 | tee "$RUNNER_TEMP/swarm-flight-verify.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-verify.log"; then
            exit 1
          fi
          grep -q '^SWARM FLIGHT VERIFIED:' "$RUNNER_TEMP/swarm-flight-verify.log"
      - name: Prove known airflow regressions cannot pass the tests
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_swarm_regressions.py
          python3 -B -m unittest discover -s tests -p test_delivery_gate.py
          python3 -B scripts/check_swarm_regressions.py
          python3 -B scripts/check_swarm_supply_regressions.py
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://save_supply_verify.gd
      - name: Play the complete scene flow and recovery controls
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://ui_verify.gd -- --swarm-qa 2>&1 | tee "$RUNNER_TEMP/swarm-flight-ui.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-ui.log"; then
            exit 1
          fi
          grep -q '^SWARM FLIGHT UI VERIFIED:' "$RUNNER_TEMP/swarm-flight-ui.log"
      - name: Verify long chapters and exact suspend resume
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          SWARM_LONG_QA_DIR: ${{ runner.temp }}/long-journey-qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SWARM_LONG_QA_DIR"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://long_journey_verify.gd 2>&1 | tee "$RUNNER_TEMP/long-model.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://long_journey_ui_verify.gd -- --long-journey --progress-file="$SWARM_LONG_QA_DIR/save.json" 2>&1 | tee "$RUNNER_TEMP/long-ui.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/long-model.log" "$RUNNER_TEMP/long-ui.log"; then exit 1; fi
          grep -q '^LONG JOURNEY VERIFIED:.*0 failures' "$RUNNER_TEMP/long-model.log"
          grep -q '^LONG JOURNEY UI VERIFIED:.*0 failures' "$RUNNER_TEMP/long-ui.log"
      - name: Verify independent weather and color-window sample
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          SWARM_WEATHER_QA_DIR: ${{ runner.temp }}/weather-window-qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SWARM_WEATHER_QA_DIR"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://weather_window_verify.gd 2>&1 | tee "$RUNNER_TEMP/weather-model.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://weather_window_ui_verify.gd -- --progress-file="$SWARM_WEATHER_QA_DIR/save.json" 2>&1 | tee "$RUNNER_TEMP/weather-ui.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --quit-after 3 -- --weather-window --swarm-qa --classic-journey 2>&1 | tee "$RUNNER_TEMP/weather-entry.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/weather-model.log" "$RUNNER_TEMP/weather-ui.log" "$RUNNER_TEMP/weather-entry.log"; then exit 1; fi
          grep -q '^WEATHER WINDOW VERIFIED:.*0 failures' "$RUNNER_TEMP/weather-model.log"
          grep -q '^WEATHER UI VERIFIED:.*0 failures' "$RUNNER_TEMP/weather-ui.log"
      - name: Verify garden music and new sound effects
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          SWARM_AUDIO_DIR: ${{ runner.temp }}/garden-audio
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://audio_verify.gd 2>&1 | tee "$RUNNER_TEMP/swarm-flight-audio.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-audio.log"; then
            exit 1
          fi
          grep -q '^GARDEN_AUDIO:' "$RUNNER_TEMP/swarm-flight-audio.log"
      - name: Start the main scene
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --quit-after 3 2>&1 | tee "$RUNNER_TEMP/swarm-flight-main.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-main.log"; then
            exit 1
          fi
