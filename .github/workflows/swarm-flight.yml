name: Swarm Flight prototype

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Swarm Flight checks (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      # Separate runners isolate Godot saves, imports and mutation fixtures.
      # Keep collecting all suites when another suite fails.
      fail-fast: false
      matrix:
        suite: [core, regressions, samples]
    env:
      GODOT_RELEASE: 4.6.2-stable
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot and verify SHA-512
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl --fail --silent --show-error --location --output "$GODOT_ARCHIVE" "$release_url/$GODOT_ARCHIVE"
          curl --fail --silent --show-error --location --output SHA512-SUMS.txt "$release_url/SHA512-SUMS.txt"
          awk -v archive="$GODOT_ARCHIVE" '$2 == archive {print; found++} END {if (found != 1) exit 1}' SHA512-SUMS.txt > selected.sha512
          sha512sum --check --strict selected.sha512
          unzip -q "$GODOT_ARCHIVE" -d godot-bin
      - name: Import isolated prototype
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/swarm-flight-import.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-import.log"; then
            exit 1
          fi
      - name: Verify rules and replay complete chapter routes
        if: matrix.suite == 'core'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://verify.gd 2>&1 | tee "$RUNNER_TEMP/swarm-flight-verify.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-verify.log"; then
            exit 1
          fi
          grep -q '^SWARM FLIGHT VERIFIED:' "$RUNNER_TEMP/swarm-flight-verify.log"
      - name: Prove known airflow regressions cannot pass the tests
        if: matrix.suite == 'regressions'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_swarm_regressions.py
          python3 -B -m unittest discover -s tests -p test_delivery_gate.py
          python3 -B -m unittest discover -s tests -p test_spring_review_gate.py
          python3 -B -m unittest discover -s tests -p test_spring_package.py
          python3 -B scripts/check_swarm_regressions.py
          python3 -B scripts/check_swarm_supply_regressions.py
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://save_supply_verify.gd
      - name: Play the complete scene flow and recovery controls
        if: matrix.suite == 'core'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://ui_verify.gd -- --swarm-qa 2>&1 | tee "$RUNNER_TEMP/swarm-flight-ui.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-ui.log"; then
            exit 1
          fi
          grep -q '^SWARM FLIGHT UI VERIFIED:' "$RUNNER_TEMP/swarm-flight-ui.log"
      - name: Verify long chapters and exact suspend resume
        if: matrix.suite == 'regressions'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          SWARM_LONG_QA_DIR: ${{ runner.temp }}/long-journey-qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SWARM_LONG_QA_DIR"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://long_journey_verify.gd 2>&1 | tee "$RUNNER_TEMP/long-model.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://long_journey_ui_verify.gd -- --long-journey --progress-file="$SWARM_LONG_QA_DIR/save.json" 2>&1 | tee "$RUNNER_TEMP/long-ui.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/long-model.log" "$RUNNER_TEMP/long-ui.log"; then exit 1; fi
          grep -q '^LONG JOURNEY VERIFIED:.*0 failures' "$RUNNER_TEMP/long-model.log"
          grep -q '^LONG JOURNEY UI VERIFIED:.*0 failures' "$RUNNER_TEMP/long-ui.log"
      - name: Verify independent weather and color-window sample
        if: matrix.suite == 'samples'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          SWARM_WEATHER_QA_DIR: ${{ runner.temp }}/weather-window-qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SWARM_WEATHER_QA_DIR"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://weather_window_verify.gd 2>&1 | tee "$RUNNER_TEMP/weather-model.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://weather_window_ui_verify.gd -- --progress-file="$SWARM_WEATHER_QA_DIR/save.json" 2>&1 | tee "$RUNNER_TEMP/weather-ui.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --quit-after 3 -- --weather-window --swarm-qa --classic-journey 2>&1 | tee "$RUNNER_TEMP/weather-entry.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/weather-model.log" "$RUNNER_TEMP/weather-ui.log" "$RUNNER_TEMP/weather-entry.log"; then exit 1; fi
          grep -q '^WEATHER WINDOW VERIFIED:.*0 failures' "$RUNNER_TEMP/weather-model.log"
          grep -q '^WEATHER UI VERIFIED:.*0 failures' "$RUNNER_TEMP/weather-ui.log"
      - name: Verify bee-dance information and exact suspend
        if: matrix.suite == 'samples'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          SWARM_DANCE_QA_DIR: ${{ runner.temp }}/bee-dance-qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SWARM_DANCE_QA_DIR"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://bee_dance_verify.gd 2>&1 | tee "$RUNNER_TEMP/dance-model.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://bee_dance_ui_verify.gd -- --progress-file="$SWARM_DANCE_QA_DIR/save.json" 2>&1 | tee "$RUNNER_TEMP/dance-ui.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --quit-after 3 -- --bee-dance --swarm-qa --classic-journey 2>&1 | tee "$RUNNER_TEMP/dance-entry.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/dance-model.log" "$RUNNER_TEMP/dance-ui.log" "$RUNNER_TEMP/dance-entry.log"; then exit 1; fi
          grep -q '^BEE DANCE VERIFIED:.*0 failures' "$RUNNER_TEMP/dance-model.log"
          grep -q '^BEE DANCE UI VERIFIED:.*0 failures' "$RUNNER_TEMP/dance-ui.log"
      - name: Verify sign-keeper encounter and persistent passage
        if: matrix.suite == 'samples'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          SWARM_KEEPER_QA_DIR: ${{ runner.temp }}/sign-keeper-qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SWARM_KEEPER_QA_DIR"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://sign_keeper_verify.gd 2>&1 | tee "$RUNNER_TEMP/keeper-model.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://sign_keeper_ui_verify.gd -- --progress-file="$SWARM_KEEPER_QA_DIR/save.json" 2>&1 | tee "$RUNNER_TEMP/keeper-ui.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --quit-after 3 -- --sign-keeper --swarm-qa --classic-journey 2>&1 | tee "$RUNNER_TEMP/keeper-entry.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/keeper-model.log" "$RUNNER_TEMP/keeper-ui.log" "$RUNNER_TEMP/keeper-entry.log"; then exit 1; fi
          grep -q '^SIGN KEEPER VERIFIED:.*0 failures' "$RUNNER_TEMP/keeper-model.log"
          grep -q '^SIGN KEEPER UI VERIFIED:.*0 failures' "$RUNNER_TEMP/keeper-ui.log"
      - name: Verify integrated03 to05 story, routes and recovery
        if: matrix.suite == 'samples'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          SWARM_SPRING_QA_DIR: ${{ runner.temp }}/spring-journey-qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SWARM_SPRING_QA_DIR"
          timeout 60s "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://leaf_canopy_verify.gd -- --variants 2>&1 | tee "$RUNNER_TEMP/leaf-canopy.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/leaf-canopy.log"; then exit 1; fi
          grep -q '^CANOPY VERIFIED:.*0 failures' "$RUNNER_TEMP/leaf-canopy.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://charge_feedback_verify.gd 2>&1 | tee "$RUNNER_TEMP/charge-feedback.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/charge-feedback.log"; then exit 1; fi
          grep -q '^CHARGE FEEDBACK VERIFIED:.*0 failures' "$RUNNER_TEMP/charge-feedback.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://spring_journey_verify.gd 2>&1 | tee "$RUNNER_TEMP/spring-model.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://spring_journey_ui_verify.gd -- --progress-file="$SWARM_SPRING_QA_DIR/save.json" 2>&1 | tee "$RUNNER_TEMP/spring-ui.log"
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --quit-after 3 -- --spring-journey --classic-journey --swarm-qa 2>&1 | tee "$RUNNER_TEMP/spring-entry.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/spring-model.log" "$RUNNER_TEMP/spring-ui.log" "$RUNNER_TEMP/spring-entry.log"; then exit 1; fi
          grep -q '^SPRING JOURNEY VERIFIED:.*0 failures' "$RUNNER_TEMP/spring-model.log"
          grep -q '^SPRING JOURNEY UI VERIFIED:.*0 failures' "$RUNNER_TEMP/spring-ui.log"
          SWARM_DEPARTURE_QA_DIR="$RUNNER_TEMP/departure" "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://departure_probe.gd 2>&1 | tee "$RUNNER_TEMP/departure.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/departure.log"; then exit 1; fi
          grep -q '^DEPARTURE VERIFIED:' "$RUNNER_TEMP/departure.log"
          SWARM_BACK_SIGN_QA_DIR="$RUNNER_TEMP/back-sign-save" "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://back_sign_save_verify.gd 2>&1 | tee "$RUNNER_TEMP/back-sign-save.log"
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' "$RUNNER_TEMP/back-sign-save.log"; then exit 1; fi
          grep -q '^BACK SIGN SAVE VERIFIED:.*0 failures' "$RUNNER_TEMP/back-sign-save.log"
      - name: Verify garden music and new sound effects
        if: matrix.suite == 'core'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
          SWARM_AUDIO_DIR: ${{ runner.temp }}/garden-audio
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --script res://audio_verify.gd 2>&1 | tee "$RUNNER_TEMP/swarm-flight-audio.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-audio.log"; then
            exit 1
          fi
          grep -q '^GARDEN_AUDIO:' "$RUNNER_TEMP/swarm-flight-audio.log"
      - name: Start the main scene
        if: matrix.suite == 'core'
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.6.2-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototypes/swarm-flight --quit-after 3 2>&1 | tee "$RUNNER_TEMP/swarm-flight-main.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/swarm-flight-main.log"; then
            exit 1
          fi

  verify:
    # Preserve the existing check name for consumers of the complete gate.
    name: Swarm Flight rules and complete routes
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every suite to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Swarm Flight suites: %s\n' "$CHECKS_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$CHECKS_RESULT" = success
