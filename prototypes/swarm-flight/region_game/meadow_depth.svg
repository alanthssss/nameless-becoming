      <stop offset=".55" stop-color="#ff0080" stop-opacity=".94"/>
      <stop offset="1" stop-color="#ff0080" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="700" height="405" fill="#004880"/>
  <g id="deep-wood">
    <ellipse cx="272" cy="51" rx="154" ry="65" fill="url(#quiet)" opacity="0.91"/>
    <ellipse cx="517" cy="57" rx="157" ry="64" fill="url(#quiet)" opacity="0.86"/>
    <ellipse cx="188" cy="297" rx="142" ry="61" fill="url(#quiet)" opacity="0.65"/>
